name: Comprobaciones
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
  android:
    if: github.ref == 'refs/heads/android/capacitor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - run: npm ci && npm run sync
        working-directory: mobile
      - run: ./gradlew assembleDebug --stacktrace
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Wall-Bounce-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
